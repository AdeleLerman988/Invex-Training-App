function swHex(name, alpha){
  var raw=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  var h=raw.replace('#','').trim();
  if(h.length===3){h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];}
  var n=parseInt(h.slice(0,6),16);
  if(!h||isNaN(n)){return alpha==null?'transparent':'transparent';}
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(alpha==null) return 'rgb('+r+','+g+','+b+')';
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

// ── AZURE STORAGE API (via Azure Static Web App Functions) ──
async function apiGetState(){
  const r = await fetch('/api/getTrackerState', { method:'GET' });
  if(!r.ok) throw new Error('getTrackerState '+r.status);
  return r.json();
}
async function apiSaveState(){
  // Build the full state payload and POST it. Debounced by scheduleSave().
  const payload = { steps: liveData, activity: feedItems };
  const r = await fetch('/api/saveTrackerState', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  if(!r.ok) throw new Error('saveTrackerState '+r.status);
  return r.json();
}
function scheduleSave(){
  // Coalesce rapid writes into one POST after 400ms of quiet
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    apiSaveState().then(()=>{
      setConn('live');
    }).catch(err=>{
      console.warn('Save failed:', err);
      setConn('offline');
    });
  }, 400);
}

function setConn(state){
  const dot=document.getElementById('conn-dot'),lbl=document.getElementById('conn-label');
  if(state==='live'){dot.className='live-dot';lbl.textContent='Live';connected=true;}
  else if(state==='offline'){dot.className='live-dot offline';lbl.textContent='Offline';connected=false;}
  else{dot.className='live-dot offline';lbl.textContent='Connecting...';connected=false;}
}

// ── POLLING ──
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  loadData();
  pollTimer=setInterval(loadData, 6000);
}
async function loadData(){
  try{
    const state = await apiGetState();
    if(state && state.steps){
      const remote=state.steps;
      // Preserve any locally-running timers not yet written to the server
      if(liveData){
        Object.keys(liveData).forEach(sid=>{
          if(!remote[sid]) remote[sid]={};
          Object.keys(liveData[sid]).forEach(idx=>{
            const loc=liveData[sid][idx];
            if(loc && loc.startTs && !loc.endTs) remote[sid][idx]=loc;
          });
        });
      }
      liveData=remote;
    }
    if(state && Array.isArray(state.activity)){ feedItems = state.activity; }
    setConn('live');
    renderStatBar(); renderMain(); updateBanner(); renderFeed();
  }catch(e){
    console.warn('Poll error:', e);
    setConn('offline');
  }
}

// ── TIMER ACTIONS ──
function startTimer(sid,idx){
  const step=(liveData[sid]||{})[idx]||{};
  if(step.startTs) return;
  writeStep(sid,idx,{startTs:Date.now(),startIso:new Date().toISOString(),who:user.name,dept:user.dept});
  logActivity(sid,idx,'started timer');
}
function stopTimer(sid,idx){
  const step=(liveData[sid]||{})[idx]||{};
  if(!step.startTs||step.endTs) return;
  const endTs=Date.now(), elapsed=endTs-step.startTs;
  writeStep(sid,idx,{endTs,endIso:new Date().toISOString(),elapsed});
  logActivity(sid,idx,'stopped timer ('+fmtElapsed(elapsed)+')');
}
function commitTxn(sid,idx,val){
  if(!val.trim()) return;
  const step=(liveData[sid]||{})[idx]||{};
  const updates={txn:val.trim(),who:user.name};
  if(step.startTs && !step.endTs){
    const endTs=Date.now();
    updates.endTs=endTs; updates.endIso=new Date().toISOString(); updates.elapsed=endTs-step.startTs;
  }
  writeStep(sid,idx,updates);
  logActivity(sid,idx,'entered: '+val.trim());
}
function resetStep(sid,idx){
  if(!confirm('Reset this step? Clears timer and confirmation number.')) return;
  writeStep(sid,idx,{txn:null,startTs:null,endTs:null,elapsed:null,startIso:null,endIso:null,who:null,dept:null});
}
function clearTxn(sid,idx){
  if(!liveData[sid]||!liveData[sid][idx]) return;
  liveData[sid][idx].txn='';
  renderStatBar(); renderMain(); updateBanner();
  scheduleSave();
}

function writeStep(sid,idx,updates){
  if(!liveData[sid]) liveData[sid]={};
  if(!liveData[sid][idx]) liveData[sid][idx]={};
  const isReset=Object.values(updates).every(v=>v===null);
  if(isReset){
    liveData[sid][idx]={};
    renderStatBar(); renderMain(); updateBanner();
    scheduleSave();
    return;
  }
  Object.assign(liveData[sid][idx], updates);
  renderStatBar(); renderMain(); updateBanner();
  scheduleSave();
}

function logActivity(sid,idx,action){
  const s=SCENARIOS.find(x=>x.id===sid);
  feedItems.unshift({
    who:user.name, dept:user.dept,
    scenario:s.name, step:s.steps[idx].name,
    action, ts:Date.now()
  });
  // keep feed trimmed
  if(feedItems.length>200) feedItems.length=200;
  renderFeed();
  scheduleSave();
}

// ── FORMATTING ──
function fmtElapsed(ms){
  if(!ms||ms<0) return null;
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  if(h>0) return h+'h '+(m%60)+'m '+(s%60)+'s';
  if(m>0) return m+'m '+(s%60)+'s';
  return s+'s';
}
function fmtLive(startTs){
  const ms=Date.now()-startTs;
  const s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000)%60,h=Math.floor(ms/3600000);
  const p=n=>String(n).padStart(2,'0');
  return h>0?p(h)+':'+p(m)+':'+p(s):p(m)+':'+p(s);
}
function fmtTs(ts){return ts?new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):''}

function getStats(sid){
  const s=SCENARIOS.find(x=>x.id===sid),d=liveData[sid]||{};
  const stepsLen=s.steps.length;
  let done=0,completedRows=0,running=0;
  const allMs=[],starts=[],ends=[];
  for(let r=0;r<TOTAL_ROWS;r++){
    let rowDone=0;
    for(let i=0;i<stepsLen;i++){
      const sd=d[r*stepsLen+i]||{};
      if(sd.txn){done++;rowDone++;}
      if(sd.elapsed) allMs.push(sd.elapsed);
      if(sd.startTs) starts.push(sd.startTs);
      if(sd.endTs) ends.push(sd.endTs);
      if(sd.startTs&&!sd.endTs) running++;
    }
    if(rowDone===stepsLen) completedRows++;
  }
  const elapsed=allMs.length?allMs.reduce((a,b)=>a+b,0):null;
  const wall=starts.length&&ends.length?Math.max(...ends)-Math.min(...starts):null;
  return{done,stepsLen,completedRows,totalRows:TOTAL_ROWS,elapsed,wall,running};
}

// ── ACTIVE BANNER ──
function updateBanner(){
  const s=SCENARIOS[cur],d=liveData[s.id]||{},sid=s.id;
  const stepsLen=s.steps.length;
  const running=[];
  for(let r=0;r<TOTAL_ROWS;r++){
    for(let i=0;i<stepsLen;i++){
      const gi=r*stepsLen+i;
      const data=d[gi]||{};
      if(data.startTs&&!data.endTs) running.push({st:s.steps[i],gi,r,data});
    }
  }
  const banner=document.getElementById('active-banner');
  const chips=document.getElementById('active-chips');
  if(!running.length){banner.classList.remove('visible');clearInterval(bannerInterval);bannerInterval=null;return;}
  banner.classList.add('visible');
  const draw=()=>{
    chips.innerHTML=running.map(({st,gi,r,data})=>
      `<div class="active-chip">
        <span class="chip-name">Ord ${r+1} · ${st.dept} · ${st.name}</span>
        <span class="chip-time">${fmtLive(data.startTs)}</span>
        <span class="chip-stop" onclick="stopTimer('${sid}',${gi})" title="Stop timer">■</span>
      </div>`
    ).join('');
  };
  draw();
  if(!bannerInterval) bannerInterval=setInterval(draw,300);
}

}

function renderStatBar(){
  const s=SCENARIOS[cur],st=getStats(s.id);
  const pct=Math.min(100,Math.round(st.completedRows/NUM_VISIBLE*100));
  document.getElementById('stat-bar').innerHTML=`
    <div class="stat">
      <div class="stat-label">Orders Complete</div>
      <div class="stat-val">${st.completedRows}<span style="font-size:13px;color:var(--muted)"> / ${NUM_VISIBLE}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Steps Done</div>
      <div class="stat-val g">${st.done}</div>
      <div class="stat-sub">${st.stepsLen} steps × ${NUM_VISIBLE} rows</div>
    </div>
    <div class="stat" style="${st.running?'border-color:var(--sw-heading)':''}">
      <div class="stat-label" style="${st.running?'color:var(--timing)':''}">Active timers</div>
      <div class="stat-val" style="${st.running?'color:var(--timing);':''}font-size:22px">${st.running}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total step time</div>
      <div class="stat-val g" style="font-size:14px">${fmtElapsed(st.elapsed)||'—'}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Wall clock</div>
      <div class="stat-val" style="font-size:14px">${fmtElapsed(st.wall)||'—'}</div>
      <div class="stat-sub">first start → last stop</div>
    </div>`;
  document.getElementById('hdr-sub').textContent=SCENARIOS[cur].label+' · '+SCENARIOS[cur].steps.length+' steps · '+TOTAL_ROWS+' rows';
}

function renderMain(){
  const prevScroll=(document.querySelector('.table-wrap')||{}).scrollLeft||0;
  const activeEl=document.activeElement;
  const activeId=(activeEl&&activeEl.classList.contains('txn-input'))?activeEl.id:null;
  const activeVal=activeId?activeEl.value:null;
  const s=SCENARIOS[cur],d=liveData[s.id]||{},sid=s.id;
  const stepsLen=s.steps.length;
  Object.values(clockIntervals).forEach(clearInterval);clockIntervals={};

  let html=`<div class="desc">${s.desc}</div>
  <div class="hint">
    <span class="hk orange">▶ Start Time</span> starts the clock —
    <span class="hk red">■ Stop Time</span> locks it in.
    <span class="hk">Confirmed</span> = value saved ·
    <span class="hk orange">On deck</span> = next step.
  </div>
  <div class="table-wrap"><table><thead><tr><th class="row-label"></th>`;

  s.steps.forEach(step=>{
    const c=DEPT_COLORS[step.dept]||'var(--sw-heading)';
    html+=`<th class="step-col" style="border-top:2px solid ${c};padding-top:6px">
      <div class="dep-label" style="color:${c}">${step.dept}</div>
      <div class="step-name-lbl">${step.name}</div>
    </th>`;
  });
  html+='</tr></thead><tbody>';

  for(let r=0;r<TOTAL_ROWS;r++){
    const isCollapsed=r>=NUM_VISIBLE;

    // On-deck: first empty step in the row
    let onDeckIdx=-1;
    for(let i=0;i<stepsLen;i++){
      if(!(d[r*stepsLen+i]||{}).txn){onDeckIdx=i;break;}
    }

    html+=`<tr${isCollapsed?' class="collapsed-row" style="display:none"':''}><td class="row-label">Order ${r+1}</td>`;

    for(let i=0;i<stepsLen;i++){
      const step=s.steps[i];
      const gi=r*stepsLen+i;
      const sd=d[gi]||{};
      const isDone=!!sd.endTs,isRunning=!!(sd.startTs&&!sd.endTs);
      const isMyDept=user&&(user.dept==='Admin'||user.dept===step.dept);
      const val=sd.txn||'';
      const isOnDeck=(i===onDeckIdx);

      let cls='txn-input';
      if(val) cls+=' has-val';
      else if(isOnDeck) cls+=' on-deck';

      html+=`<td class="cell"><div class="cell-inner">
        <input id="inp_${sid}_${gi}" class="${cls}" type="text"
          value="${val.replace(/"/g,'&quot;')}"
          placeholder="Confirmation #"
          ${(!isMyDept||isDone)?'disabled':''}
          onchange="commitTxn('${sid}',${gi},this.value)"
          onkeydown="if(event.key==='Enter'){commitTxn('${sid}',${gi},this.value);this.blur()}"
        />`;
      if(val&&isMyDept) html+=`<button class="btn-clear-txn" onclick="clearTxn('${sid}',${gi})" title="Clear confirmation number">× clear</button>`;
      html+=`<div class="timer-row">`;

      if(isOnDeck&&isMyDept){
        if(!isRunning&&!isDone){
          html+=`<button class="btn-start" onclick="startTimer('${sid}',${gi})">▶ Start Time</button>`;
        }
        if(isRunning){
          html+=`<button class="btn-stop" onclick="stopTimer('${sid}',${gi})">■ Stop Time</button>
          <div class="live-clock" id="clk_${sid}_${gi}">${fmtLive(sd.startTs)}</div>`;
        }
        if(isDone){
          html+=`<div class="elapsed-done">✓ ${fmtElapsed(sd.elapsed)||'<1s'}</div>`;
          html+=`<button class="btn-reset" onclick="resetStep('${sid}',${gi})" title="Reset step">↺</button>`;
        }
      }else if(isDone){
        html+=`<div class="elapsed-done">✓ ${fmtElapsed(sd.elapsed)||'<1s'}</div>`;
        if(isMyDept) html+=`<button class="btn-reset" onclick="resetStep('${sid}',${gi})" title="Reset step">↺</button>`;
        }

        // Add "+ Job Set" button (only for "Sales Order #" step)
        if (val && isMyDept && step.name == "Sales Order #") {
            const xgi = r * stepsLen + i + 8;
            const xsd = d[xgi] || {};
            const xval = xsd.txn || '';

            if (!xval) {
                html += `<button class="btn-start" onclick="createJobSetFake('${sid}',${gi})" id="cjs_${sid}_${gi}">Create Job Set</button>`;
            }
        }

      html+='</div>';
      if(sd.who) html+=`<div class="who-lbl">${sd.who}${sd.startTs?' · '+fmtTs(sd.startTs):''}</div>`;
      html+='</div></td>';
    }

    html+='</tr>';

    // Show/hide toggle row after the last always-visible row
    if(r===NUM_VISIBLE-1){
      html+=`<tr><td colspan="${stepsLen+1}" class="show-more-cell">
        <button class="btn btn-g" style="font-size:11px;padding:5px 16px" onclick="toggleCollapsed(this)">▼ Show ${NUM_COLLAPSED} more rows</button>
      </td></tr>`;
    }
  }

  html+='</tbody></table></div>';
  document.getElementById('main').innerHTML=html;
  const tw=document.querySelector('.table-wrap');
  if(tw&&prevScroll) tw.scrollLeft=prevScroll;
  syncHScroll();
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){el.value=activeVal;el.focus();}
  }

  // Restart live clocks for any running timers
  for(let r=0;r<TOTAL_ROWS;r++){
    for(let i=0;i<stepsLen;i++){
      const gi=r*stepsLen+i;
      const sd=d[gi]||{};
      if(sd.startTs&&!sd.endTs){
        const key=`${sid}_${gi}`;
        clockIntervals[key]=setInterval(()=>{
          const el=document.getElementById(`clk_${sid}_${gi}`);
          if(el) el.textContent=fmtLive(sd.startTs);
        },200);
      }
    }
  }
}

function toggleCollapsed(btn){
  const rows=document.querySelectorAll('tr.collapsed-row');
  const hidden=rows.length&&rows[0].style.display==='none';
  rows.forEach(r=>r.style.display=hidden?'':'none');
  btn.textContent=hidden?('▲ Hide '+NUM_COLLAPSED+' extra rows'):('▼ Show '+NUM_COLLAPSED+' more rows');
}

function renderFeed(){
  const list=document.getElementById('feed-list');
  if(!feedItems.length){
    list.innerHTML='<span style="font-size:11px;font-family:var(--mono);color:var(--muted)">No activity yet.</span>';
    return;
  }
  list.innerHTML=feedItems.slice(0,20).map(item=>
    `<div class="feed-item">
      <span class="who">${item.who}</span>
      <span style="color:var(--muted)"> (${item.dept}) — ${item.action} · <span style="color:var(--text)">${item.step}</span> [${item.scenario}]</span>
      <span class="ts">${fmtTs(item.ts)}</span>
    </div>`
  ).join('');
}

function clearScenario(){
  if(!confirm('Clear ALL data for this scenario? This cannot be undone.')) return;
  const s=SCENARIOS[cur], sid=s.id;
  liveData[sid]={};
  renderStatBar(); renderMain(); updateBanner();
  scheduleSave();
}

function exportCSV(){
  const s=SCENARIOS[cur],d=liveData[s.id]||{};
  const stepsLen=s.steps.length;
  const hdrs=['Order','Step','Department','Confirmation #','Who','Start Time','End Time','Elapsed'];
  const rows=[];
  for(let r=0;r<TOTAL_ROWS;r++){
    for(let i=0;i<stepsLen;i++){
      const gi=r*stepsLen+i,sd=d[gi]||{},st=s.steps[i];
      rows.push([r+1,st.name,st.dept,sd.txn||'',sd.who||'',
        sd.startIso?new Date(sd.startIso).toLocaleString():'',
        sd.endIso?new Date(sd.endIso).toLocaleString():'',
        fmtElapsed(sd.elapsed)||'']);
    }
  }
  const csv=[hdrs,...rows].map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=s.id+'_tracking.csv';a.click();
}

// ── FIXED HORIZONTAL SCROLLBAR SYNC ──
let _hss=false;
function _onWrapScroll(){
  if(_hss) return; _hss=true;
  const b=document.getElementById('hscroll-bar'),w=document.querySelector('.table-wrap');
  if(b&&w) b.scrollLeft=w.scrollLeft;
  _hss=false;
}
function _onBarScroll(){
  if(_hss) return; _hss=true;
  const b=document.getElementById('hscroll-bar'),w=document.querySelector('.table-wrap');
  if(b&&w) w.scrollLeft=b.scrollLeft;
  _hss=false;
}
function syncHScroll(){
  const w=document.querySelector('.table-wrap'),b=document.getElementById('hscroll-bar'),inner=document.getElementById('hscroll-inner');
  if(!w||!b||!inner) return;
  const tbl=w.querySelector('table');
  if(tbl) inner.style.width=tbl.scrollWidth+'px';
  w.removeEventListener('scroll',_onWrapScroll);
  b.removeEventListener('scroll',_onBarScroll);
  w.addEventListener('scroll',_onWrapScroll,{passive:true});
  b.addEventListener('scroll',_onBarScroll,{passive:true});
}

loadUser();
</script>
